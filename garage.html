<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hill Climb - Гараж</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2b2b2b;
            color: #fff;
            font-family: 'Arial', sans-serif;
        }
        
        .header {
            padding: 15px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            background: none;
            border: none;
            color: #3390ec;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .balance-box {
            background: #FFD700;
            color: #000;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .garage-container {
            padding: 20px;
        }

        .upgrade-card {
            background: #3c3c3c;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .upgrade-info h3 { margin: 0 0 5px 0; font-size: 20px; }
        .upgrade-info p { margin: 0; color: #aaa; font-size: 14px; }
        
        .upgrade-btn {
            background: #4CAF50;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .upgrade-btn:disabled {
            background: #555;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="window.location.href='hillclimb_menu.html'">◀ Назад</button>
        <h2>ГАРАЖ</h2>
        <div class="balance-box">💰 <span id="balance">...</span></div>
    </div>

    <div class="garage-container">
        <!-- Улучшение Двигателя -->
        <div class="upgrade-card">
            <div class="upgrade-info">
                <h3>Двигатель (Ур. <span id="engine-lvl">...</span>)</h3>
                <p>Увеличивает скорость</p>
            </div>
            <button class="upgrade-btn" id="buy-engine-btn" onclick="buyEngine()">
                <span id="engine-cost">...</span> 💰
            </button>
        </div>

        <!-- Улучшение Подвески -->
        <div class="upgrade-card">
            <div class="upgrade-info">
                <h3>Подвеска (Ур. <span id="suspension-lvl">...</span>)</h3>
                <p>Меньше трясет, лучше прыгает</p>
            </div>
            <button class="upgrade-btn" id="buy-suspension-btn" onclick="buySuspension()">
                <span id="suspension-cost">...</span> 💰
            </button>
        </div>

        <!-- Улучшение Шин -->
        <div class="upgrade-card">
            <div class="upgrade-info">
                <h3>Шины (Ур. <span id="tires-lvl">...</span>)</h3>
                <p>Улучшают сцепление с землей</p>
            </div>
            <button class="upgrade-btn" id="buy-tires-btn" onclick="buyTires()">
                <span id="tires-cost">...</span> 💰
            </button>
        </div>
    </div>

    <script>
        let balance = 0;
        let engineLvl = 1;
        let suspensionLvl = 1;
        let tiresLvl = 1;

        function loadData() {
            try {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage && window.Telegram.WebApp.CloudStorage.getItem) {
                    window.Telegram.WebApp.CloudStorage.getItem('hillClimbCoins', (err, value) => {
                        let coinsStr = (value !== undefined && value !== null && value !== '') ? value : localStorage.getItem('hillClimbCoins') || '0';
                        balance = parseInt(coinsStr) || 0;
                        document.getElementById('balance').innerText = balance;
                        updateUI();
                    });
                    window.Telegram.WebApp.CloudStorage.getItem('engineLevel', (err, value) => {
                        let engStr = (value !== undefined && value !== null && value !== '') ? value : localStorage.getItem('engineLevel') || '1';
                        engineLvl = parseInt(engStr) || 1;
                        document.getElementById('engine-lvl').innerText = engineLvl;
                        updateUI();
                    });
                    window.Telegram.WebApp.CloudStorage.getItem('suspensionLevel', (err, value) => {
                        let suspStr = (value !== undefined && value !== null && value !== '') ? value : localStorage.getItem('suspensionLevel') || '1';
                        suspensionLvl = parseInt(suspStr) || 1;
                        document.getElementById('suspension-lvl').innerText = suspensionLvl;
                        updateUI();
                    });
                    window.Telegram.WebApp.CloudStorage.getItem('tiresLevel', (err, value) => {
                        let tiresStr = (value !== undefined && value !== null && value !== '') ? value : localStorage.getItem('tiresLevel') || '1';
                        tiresLvl = parseInt(tiresStr) || 1;
                        document.getElementById('tires-lvl').innerText = tiresLvl;
                        updateUI();
                    });
                } else {
                    throw new Error("No CloudStorage");
                }
            } catch (e) {
                balance = parseInt(localStorage.getItem('hillClimbCoins')) || 0;
                engineLvl = parseInt(localStorage.getItem('engineLevel')) || 1;
                suspensionLvl = parseInt(localStorage.getItem('suspensionLevel')) || 1;
                tiresLvl = parseInt(localStorage.getItem('tiresLevel')) || 1;
                document.getElementById('balance').innerText = balance;
                document.getElementById('engine-lvl').innerText = engineLvl;
                document.getElementById('suspension-lvl').innerText = suspensionLvl;
                document.getElementById('tires-lvl').innerText = tiresLvl;
                updateUI();
            }
        }

        function updateUI() {
            // Двигатель
            let engineCost = engineLvl * 50;
            let engineBtn = document.getElementById('buy-engine-btn');
            document.getElementById('engine-cost').innerText = engineCost;
            if (balance >= engineCost) {
                engineBtn.disabled = false;
                engineBtn.style.background = '#4CAF50';
            } else {
                engineBtn.disabled = true;
                engineBtn.style.background = '#555';
            }

            // Подвеска
            let suspensionCost = suspensionLvl * 50;
            let suspensionBtn = document.getElementById('buy-suspension-btn');
            document.getElementById('suspension-cost').innerText = suspensionCost;
            if (balance >= suspensionCost) {
                suspensionBtn.disabled = false;
                suspensionBtn.style.background = '#4CAF50';
            } else {
                suspensionBtn.disabled = true;
                suspensionBtn.style.background = '#555';
            }

            // Шины
            let tiresCost = tiresLvl * 50;
            let tiresBtn = document.getElementById('buy-tires-btn');
            document.getElementById('tires-cost').innerText = tiresCost;
            if (balance >= tiresCost) {
                tiresBtn.disabled = false;
                tiresBtn.style.background = '#4CAF50';
            } else {
                tiresBtn.disabled = true;
                tiresBtn.style.background = '#555';
            }
        }

        function buyEngine() {
            let cost = engineLvl * 50;
            if (balance >= cost) {
                balance -= cost;
                engineLvl++;
                document.getElementById('balance').innerText = balance;
                document.getElementById('engine-lvl').innerText = engineLvl;
                saveData();
                updateUI();
                triggerHaptic();
            }
        }

        function buySuspension() {
            let cost = suspensionLvl * 50;
            if (balance >= cost) {
                balance -= cost;
                suspensionLvl++;
                document.getElementById('balance').innerText = balance;
                document.getElementById('suspension-lvl').innerText = suspensionLvl;
                saveData();
                updateUI();
                triggerHaptic();
            }
        }

        function buyTires() {
            let cost = tiresLvl * 50;
            if (balance >= cost) {
                balance -= cost;
                tiresLvl++;
                document.getElementById('balance').innerText = balance;
                document.getElementById('tires-lvl').innerText = tiresLvl;
                saveData();
                updateUI();
                triggerHaptic();
            }
        }

        function saveData() {
            localStorage.setItem('hillClimbCoins', balance.toString());
            localStorage.setItem('engineLevel', engineLvl.toString());
            localStorage.setItem('suspensionLevel', suspensionLvl.toString());
            localStorage.setItem('tiresLevel', tiresLvl.toString());

            try {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage && window.Telegram.WebApp.CloudStorage.setItem) {
                    window.Telegram.WebApp.CloudStorage.setItem('hillClimbCoins', balance.toString(), function(){});
                    window.Telegram.WebApp.CloudStorage.setItem('engineLevel', engineLvl.toString(), function(){});
                    window.Telegram.WebApp.CloudStorage.setItem('suspensionLevel', suspensionLvl.toString(), function(){});
                    window.Telegram.WebApp.CloudStorage.setItem('tiresLevel', tiresLvl.toString(), function(){});
                }
            } catch (e) {}
        }

        function triggerHaptic() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
        }

        loadData();
    </script>
</body>
</html>
