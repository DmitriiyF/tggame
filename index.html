<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-theme-bg-color, #1e1e1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background-color: var(--tg-theme-secondary-bg-color, #2d2d2d);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            max-width: 500px;
        }

        .game-card {
            background-color: var(--tg-theme-secondary-bg-color, #2d2d2d);
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
        }

        .game-card:active {
            transform: scale(0.95);
        }

        .game-card.active {
            border-color: var(--tg-theme-button-color, #3390ec);
        }

        .game-icon {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .hill-icon { background: linear-gradient(135deg, #87CEEB, #4CAF50); }
        .soon-icon { background: linear-gradient(135deg, #444, #222); color: #888;}

        .game-title {
            padding: 12px 5px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🕹 Мои Игры</h1>
    </div>

    <div class="games-grid">
        <!-- Карточка игры Hill Climb -->
        <div class="game-card active" onclick="startGame('hillclimb_menu.html')">
            <div class="game-icon hill-icon">🚙</div>
            <div class="game-title">Hill Climb</div>
        </div>

        <!-- Заглушки -->
        <div class="game-card" onclick="alert('Эта игра еще в разработке!')">
            <div class="game-icon soon-icon">❓</div>
            <div class="game-title">Скоро...</div>
        </div>
        
        <div class="game-card" onclick="alert('Эта игра еще в разработке!')">
            <div class="game-icon soon-icon">❓</div>
            <div class="game-title">Скоро...</div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            try { window.Telegram.WebApp.expand(); } catch (e) {}
        }

        function startGame(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
