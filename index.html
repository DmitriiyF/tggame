<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arcade Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 75%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
    }

    .hub-header {
      width: 100%;
      padding: max(18px, env(safe-area-inset-top, 18px)) 20px 18px 20px;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
    }

    .hub-title {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(180deg, #fde047 0%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .hub-coins {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid #f59e0b;
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 16px;
      font-weight: 700;
      color: #fde047;
    }

    .hub-subtitle {
      width: 100%;
      max-width: 540px;
      padding: 18px 18px 6px 18px;
      font-size: 14px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 12px 18px;
      width: 100%;
      max-width: 540px;
    }

    .game-card {
      background: rgba(30, 41, 59, 0.88);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s ease, border-color 0.12s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 2px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .game-card:active {
      transform: scale(0.96);
    }

    .game-card.active {
      border-color: #38bdf8;
      box-shadow: 0 10px 28px rgba(56, 189, 248, 0.22);
    }

    .game-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #22c55e;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .game-badge.soon {
      background: #475569;
      color: #cbd5e1;
    }

    .game-icon {
      width: 100%;
      height: 128px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 62px;
    }

    .ridge-icon {
      background: linear-gradient(160deg, #0284c7 0%, #38bdf8 55%, #22c55e 55%, #15803d 100%);
    }

    .soon-icon {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #475569;
    }

    .game-info {
      padding: 12px 14px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .game-title {
      font-weight: 700;
      font-size: 18px;
      color: #ffffff;
    }

    .game-meta {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="hub-header">
    <h1 class="hub-title">🕹 ARCADE HUB</h1>
    <div class="hub-coins">
      <span>🪙</span>
      <span id="hub-coins-val">500</span>
    </div>
  </div>

  <div class="hub-subtitle">Выбери игру</div>

  <div class="games-grid">
    <!-- Игра 1: Ridge Rush (Hill Climb) -->
    <div class="game-card active" onclick="startGame('hillclimb.html')">
      <span class="game-badge">NEW</span>
      <div class="game-icon ridge-icon">🚙</div>
      <div class="game-info">
        <div class="game-title">Ridge Rush</div>
        <div class="game-meta" id="rr-best-meta">Гоночная физика 2D</div>
      </div>
    </div>

    <!-- Слоты под будущие игры -->
    <div class="game-card" onclick="soonAlert()">
      <span class="game-badge soon">SOON</span>
      <div class="game-icon soon-icon">🚀</div>
      <div class="game-info">
        <div class="game-title">Игра #2</div>
        <div class="game-meta">В разработке...</div>
      </div>
    </div>

    <div class="game-card" onclick="soonAlert()">
      <span class="game-badge soon">SOON</span>
      <div class="game-icon soon-icon">⚔️</div>
      <div class="game-info">
        <div class="game-title">Игра #3</div>
        <div class="game-meta">В разработке...</div>
      </div>
    </div>

    <div class="game-card" onclick="soonAlert()">
      <span class="game-badge soon">SOON</span>
      <div class="game-icon soon-icon">🧩</div>
      <div class="game-info">
        <div class="game-title">Игра #4</div>
        <div class="game-meta">В разработке...</div>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      try { window.Telegram.WebApp.expand(); } catch (e) {}
    }

    try {
      const raw = localStorage.getItem('ridge_rush_save_v1');
      if (raw) {
        const data = JSON.parse(raw);
        if (typeof data.coins === 'number') {
          document.getElementById('hub-coins-val').textContent = data.coins.toLocaleString();
        }
        if (data.bestDist) {
          const maxBest = Math.max(0, ...Object.values(data.bestDist));
          if (maxBest > 0) {
            document.getElementById('rr-best-meta').textContent = `Рекорд: ${maxBest} м`;
          }
        }
      }
    } catch (e) {}

    function startGame(url) {
      window.location.href = url;
    }

    function soonAlert() {
      alert('Эта игра скоро появится в хабе!');
    }
  </script>
</body>
</html>
