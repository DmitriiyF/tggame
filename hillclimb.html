<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Hill Climb</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #87CEEB; 
            touch-action: none; 
        }
        canvas { 
            display: block; 
        }
        #error-log {
            position: absolute;
            top: 0;
            left: 0;
            color: red;
            background: rgba(255,255,255,0.8);
            z-index: 9999;
            font-family: monospace;
            padding: 10px;
            pointer-events: none;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="error-log"></div>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            document.getElementById('error-log').innerText += "\nError: " + msg + "\nLine: " + line;
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            document.getElementById('error-log').innerText += "\nPromise Error: " + event.reason;
        });
    </script>
    <script src="game.js?v=1.1"></script>
    <div style="position: absolute; top: 10px; right: 10px; font-size: 14px; color: rgba(255,255,255,0.7); font-family: Arial; pointer-events: none; z-index: 100;">v1.1</div>
</body>
</html>
